# nginx for the built site: cache policy, the headers this preview is served
# with, and 404s that are actually 404s.
#
# The site is prerendered, so every route is a real file on disk and an unknown
# path must say so. That is also why there is no SPA fallback here: falling back
# to index.html would answer every typo with the homepage and a 200.
#
# This host is an unlisted preview of a site that will eventually live on the
# client's own domain, so it is kept out of search engines two ways: the
# X-Robots-Tag header and a robots.txt that disallows everything. Both have to
# be removed when the site moves to the client's domain.
#
# Every add_header sits at server level. nginx replaces the inherited header set
# as soon as a location declares one of its own, so the cache policy is applied
# through a map instead of inside a location - otherwise the security and
# noindex headers would silently disappear for cached assets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lucian-nginx
  namespace: services
data:
  default.conf: |
    map $uri $cache_control {
        default                                      "no-cache";
        ~^/index\.[A-Za-z0-9_-]+\.(js|woff2)$        "public, max-age=31536000, immutable";
        # The two files that keep a fixed name, so they cannot be immutable.
        ~^/(favicon-32\.png|apple-touch-icon\.png)$  "public, max-age=604800";
        # Photographs are content-addressed (denker.8f3a1c.avif), which is what
        # lets them be cached for a year instead of a week.
        ~\.(png|jpg|webp|avif|svg)$                  "public, max-age=31536000, immutable";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cache-Control $cache_control always;
        # The site loads nothing from outside its own origin: no CDN, no tag
        # manager, no third-party fonts. form-action stays 'self' because the
        # contact form composes a mailto: rather than posting anywhere.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript text/plain application/json application/xml image/svg+xml;

        # The production domain will want this line; the preview must not point
        # crawlers at anything.
        # location = /robots.txt { return 200 "User-agent: *\nAllow: /\nSitemap: https://www.luciancs.nl/sitemap.xml\n"; }
        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # 404.html is a prerendered page like any other; serving it through
        # error_page keeps the status code honest.
        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
