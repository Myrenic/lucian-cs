# A stock nginx serving the ConfigMap-mounted build.
#
# There is no image registry in this cluster, so the site is committed as a
# ConfigMap (see webui/scripts/build-configmap.mjs) and mounted read-only. That
# is the same contract mushroom-finder and mytops use; the only thing that
# changes per release is the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucian-cs
  namespace: services
  labels:
    app: lucian-cs
    app.kubernetes.io/name: lucian-cs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lucian-cs
  template:
    metadata:
      labels:
        app: lucian-cs
        app.kubernetes.io/name: lucian-cs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webui
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webui
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: media
              mountPath: /usr/share/nginx/html/media
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx writes its pid and proxy caches; the root filesystem is
            # read-only, so both need a writable emptyDir.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
      volumes:
        - name: webui
          configMap:
            name: lucian-webui
        - name: media
          configMap:
            name: lucian-media
        - name: nginx-conf
          configMap:
            name: lucian-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
