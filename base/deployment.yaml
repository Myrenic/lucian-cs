# A stock nginx serving the built site.
#
# There is no image registry in this cluster, so the site is committed as
# ConfigMaps and unpacked before nginx starts. The unpack step exists because a
# ConfigMap key may not contain a slash and the routes are nested: the builder
# stores "/info/acties.html" as "info__acties.html.gz", and the initContainer
# turns that back into a path, gunzipping as it goes.
#
# The photographs are copied into the same tree rather than mounted at
# /usr/share/nginx/html/media: a volume nested inside another volume fails here,
# because runc has to create the mount point on the read-only image filesystem
# before the parent mount is in place.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucian-cs
  namespace: services
  labels:
    app: lucian-cs
    app.kubernetes.io/name: lucian-cs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lucian-cs
  template:
    metadata:
      labels:
        app: lucian-cs
        app.kubernetes.io/name: lucian-cs
      annotations:
        # Stamped by scripts/build-configmap.mjs on every build. The site is
        # unpacked into an emptyDir by the initContainer, which only runs when a
        # pod starts - so without this, new ConfigMaps would be applied and
        # never read.
        checksum/config: "d7be6db7397fc6044e4bf35c3f18fc5a"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: unpack
          image: docker.io/library/busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /html
              for dir in /pages /assets; do
                for f in "$dir"/*; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  case "$name" in
                    *.gz) out=$(echo "${name%.gz}" | sed 's/__/\//g'); mkdir -p "$(dirname "$out")"; gunzip -c "$f" > "$out" ;;
                    *)    out=$(echo "$name" | sed 's/__/\//g'); mkdir -p "$(dirname "$out")"; cp "$f" "$out" ;;
                  esac
                done
              done
              mkdir -p media
              cp /media/* media/
              echo "unpacked $(find . -type f | wc -l) files"
          volumeMounts:
            - name: pages
              mountPath: /pages
              readOnly: true
            - name: assets
              mountPath: /assets
              readOnly: true
            - name: media
              mountPath: /media
              readOnly: true
            - name: html
              mountPath: /html
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
      containers:
        - name: webui
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx writes its pid and proxy caches; the root filesystem is
            # read-only, so both need a writable emptyDir.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
      volumes:
        - name: pages
          configMap:
            name: lucian-pages
        - name: assets
          configMap:
            name: lucian-webui
        - name: media
          configMap:
            name: lucian-media
        - name: nginx-conf
          configMap:
            name: lucian-nginx
        - name: html
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
