# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Three ConfigMaps because one object may not exceed 1 MiB: the prerendered
  # pages, the hashed bundle, and the photographs. An initContainer unpacks the
  # first two into the pod before nginx starts.
  - ./pages.configmap.json
  - ./webui.configmap.json
  - ./media.configmap.json
  - ./nginx.configmap.yaml
  - ./deployment.yaml
  - ./service.yaml
